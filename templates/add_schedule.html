{% extends 'base.html' %}
{% block title %}Tambah Jadwal — Jadwal Jabez{% endblock %}

{% block content %}

<div class="form-page">
    <div class="form-header">
        <a href="{{ url_for('index') }}" class="back-link">← Kembali</a>
        <h2>➕ Tambah Jadwal Baru</h2>
        <p class="form-subtitle">Isi detail kegiatan yang ingin kamu jadwalkan.</p>
    </div>

    <form method="POST" action="{{ url_for('add_schedule') }}" class="schedule-form" id="scheduleForm">
        <!-- Nama Kegiatan -->
        <div class="form-group">
            <label for="title">Nama Kegiatan <span class="required">*</span></label>
            <input type="text" id="title" name="title"
                   placeholder="Contoh: Belajar Python"
                   value="{{ form_data.get('title', '') }}"
                   required>
        </div>

        <!-- Deskripsi -->
        <div class="form-group">
            <label for="description">Deskripsi <span class="optional">(opsional)</span></label>
            <textarea id="description" name="description"
                      placeholder="Contoh: Belajar dasar Flask selama 1 jam"
                      rows="3">{{ form_data.get('description', '') }}</textarea>
        </div>

        <!-- Tanggal -->
        <div class="form-group">
            <label for="date">Tanggal <span class="required">*</span></label>
            <input type="date" id="date" name="date"
                   value="{{ form_data.get('date', today) }}">
        </div>

        <!-- Waktu -->
        <div class="form-row">
            <div class="form-group">
                <label for="start_time">Waktu Mulai <span class="required">*</span></label>
                <input type="time" id="start_time" name="start_time"
                       value="{{ form_data.get('start_time', '') }}" required>
            </div>
            <div class="form-group">
                <label for="end_time">Waktu Selesai <span class="required">*</span></label>
                <input type="time" id="end_time" name="end_time"
                       value="{{ form_data.get('end_time', '') }}" required>
            </div>
        </div>

        <!-- Kategori & Prioritas -->
        <div class="form-row">
            <div class="form-group">
                <label for="category">Kategori</label>
                <select id="category" name="category">
                    {% for cat in categories %}
                    <option value="{{ cat.value }}"
                        {% if form_data.get('category') == cat.value %}selected{% endif %}>
                        {{ cat.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="priority">Prioritas</label>
                <select id="priority" name="priority">
                    {% for pri in priorities %}
                    <option value="{{ pri.value }}"
                        {% if form_data.get('priority') == pri.value %}selected{% endif %}>
                        {{ pri.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Jadwal Berulang -->
        <div class="form-group">
            <label class="toggle-label">
                <input type="checkbox" id="is_recurring" name="is_recurring"
                       {% if form_data.get('is_recurring') %}checked{% endif %}>
                <span class="toggle-switch"></span>
                <span>Jadwal Berulang (setiap minggu)</span>
            </label>
        </div>

        <!-- Pilih Hari -->
        <div class="form-group recurring-days-group" id="recurringDaysGroup"
             {% if not form_data.get('is_recurring') %}hidden{% endif %}>
            <label>Pilih Hari</label>
            <div class="day-chips">
                {% for value, label in weekdays %}
                <label class="day-chip">
                    <input type="checkbox" name="recurring_days" value="{{ value }}"
                           {% if value in form_data.getlist('recurring_days', []) %}checked{% endif %}>
                    <span>{{ label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <!-- Submit -->
        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Batal</a>
            <button type="submit" class="btn btn-primary">💾 Simpan Jadwal</button>
        </div>
    </form>
</div>

{% endblock %}
